<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roulette Wheel</title>
<script>
/* =====================================================================
   ✏️  CONFIGURE YOUR WHEEL HERE
   Edit the values below, save the file, and reload it in your browser.
   Colours can be any CSS colour: "#ff0000", "red", "rgb(255,0,0)" …
   ===================================================================== */
window.WHEEL_CONFIG = {

  // Title shown at the top of the page
  title: "🎡 Fiskroulette",

  // Names on the wheel – add or remove as many as you like
  names: [
    "Mamma",
    "Rasha",
    "Merman",
    "Kristian & Leopold",
    "Petra",
    "Ivar",
  ],

  // Slice colours – used in order and repeated if there are more names than colours
  sliceColors: ["#ffffcc", "#b2d9ff", "#ffffcc", "#b2d9ff", "#ffffcc", "#b2d9ff"],

  // Pop-up text shown when a name is picked:  [text before]  NAME  [textAfter]
  // First spin uses firstSpinText. Every spin after that uses nextSpinText,
  // where {previous} is replaced by the name picked on the spin before.
  firstSpinText: "Först ut är…",
  nextSpinText:  "{previous} får slå:",
  textAfter:  "",          // leave "" for none

  // Other colours
  colors: {
    background:     "#14121f",  // page background
    sliceText:      "#ffffff",  // names on the wheel ("auto" = black/white for best contrast)
    wheelBorder:    "#ffffff",
    pointer:        "#ffffff",
    centerButton:   "#ffffff",
    popupBackground:"#1f1c2e",
    popupText:      "#f2f0fa",
  },
  winnerInSliceColor: true,     // show the picked name in its slice colour
  fish:         true,           // small fish icon under each name (8 kinds, cycled)

  // Behaviour
  spinSeconds:  5,              // how long a spin lasts
  sound:        true,           // tick sound while spinning
  confetti:     true,           // confetti when a name is picked
  removeWinner: false,          // take a name off the wheel after it's picked

  // Show the settings panel beside the wheel (changes there are NOT saved to this file)
  showSettingsPanel: false,
};
/* ===================== end of configuration ===================== */
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14121f;
    --panel: #1f1c2e;
    --panel2: #2a263d;
    --text: #f2f0fa;
    --muted: #a39fba;
    --accent: #ffcc33;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header { padding: 18px 24px 0; display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: .5px; }
  main {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px;
    gap: 24px; padding: 20px 24px 24px; align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  /* Wheel area */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .wheel-wrap { position: relative; width: min(560px, 92vw); aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 20px solid transparent; border-right: 20px solid transparent;
    border-top: 38px solid var(--pointer, #ffffff);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); z-index: 2;
  }
  .hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 18%; aspect-ratio: 1; border-radius: 50%;
    background: var(--hub, #ffffff); border: none; cursor: pointer;
    font: 800 clamp(.8rem, 2.4vw, 1.2rem) 'Outfit', sans-serif; color: var(--hubtext, #14121f);
    box-shadow: 0 4px 14px rgba(0,0,0,.45), inset 0 -3px 0 rgba(0,0,0,.15);
    transition: transform .15s;
  }
  .hub:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.06); }
  .hub:disabled { cursor: default; opacity: .85; }
  .spin-btn {
    background: var(--accent); color: #1a1500; border: none; border-radius: 999px;
    padding: 14px 48px; font: 800 1.2rem 'Outfit', sans-serif; cursor: pointer;
    box-shadow: 0 6px 18px rgba(255,204,51,.25);
  }
  .spin-btn:disabled { opacity: .5; cursor: default; }
  .last { color: var(--muted); min-height: 1.4em; text-align: center; }
  .last b { color: var(--text); }

  /* Panel */
  .panel { background: var(--panel); border-radius: var(--radius); overflow: hidden; }
  .tabs { display: flex; background: var(--panel2); }
  .tabs button {
    flex: 1; background: none; border: none; color: var(--muted); padding: 12px 6px;
    font: 600 .95rem 'Outfit', sans-serif; cursor: pointer; border-bottom: 3px solid transparent;
  }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab { padding: 16px; display: none; }
  .tab.active { display: block; }
  label.lbl { display: block; font-size: .82rem; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .6px; }
  label.lbl:first-child { margin-top: 0; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid #3a3552;
    border-radius: 8px; padding: 9px 10px; font: 400 .95rem 'Outfit', sans-serif;
  }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=color] {
    width: 38px; height: 34px; padding: 0; border: none; border-radius: 8px; background: none; cursor: pointer; flex-shrink: 0;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border-radius: 6px; border: 1px solid rgba(255,255,255,.2); }

  .names { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; padding-right: 4px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row .num { width: 22px; color: var(--muted); font-size: .8rem; text-align: right; flex-shrink: 0; }
  .icon-btn {
    background: var(--panel2); border: 1px solid #3a3552; color: var(--muted);
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer; flex-shrink: 0; font-size: 1rem;
  }
  .icon-btn:hover { color: #ff6b6b; border-color: #ff6b6b; }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid #3a3552; border-radius: 8px;
    padding: 9px 12px; font: 600 .9rem 'Outfit', sans-serif; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #1a1500; border-color: var(--accent); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .count { font-size: .85rem; color: var(--muted); margin-top: 8px; }

  .palettes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pal { border: 2px solid transparent; border-radius: 8px; padding: 6px; background: var(--panel2); cursor: pointer; text-align: left; color: var(--text); font: 600 .8rem 'Outfit', sans-serif; }
  .pal:hover { border-color: var(--accent); }
  .pal .sw { display: flex; height: 16px; border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .pal .sw span { flex: 1; }
  .color-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; }
  .color-grid span { font-size: .92rem; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .95rem; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }

  .history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 380px; overflow-y: auto; }
  .history li { background: var(--panel2); border-radius: 8px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; }
  .history .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .history .n { color: var(--muted); font-size: .8rem; width: 24px; }
  .empty { color: var(--muted); font-size: .95rem; }

  /* Popup */
  .overlay {
    position: fixed; inset: 0; background: rgba(8,6,16,.7); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .overlay.show { display: flex; }
  .popup {
    background: var(--popbg, #1f1c2e); color: var(--poptext, #f2f0fa);
    border-radius: 22px; padding: 36px 40px 28px; text-align: center;
    max-width: 560px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); border-top: 8px solid var(--wincolor, #ffcc33);
    animation: pop .45s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .popup .pre { font-size: 1.25rem; opacity: .85; margin-bottom: 6px; white-space: pre-wrap; }
  .popup .winner { font-size: clamp(2rem, 7vw, 3.4rem); font-weight: 800; line-height: 1.1; word-break: break-word; color: var(--wincolor, #ffcc33); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .popup .post { font-size: 1.1rem; opacity: .85; margin-top: 8px; white-space: pre-wrap; }
  .popup .btn-row { justify-content: center; margin-top: 24px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; width: 100%; height: 100%; }
</style>
</head>
<body>
<header><h1 id="title">🎡 Roulette Wheel</h1></header>

<main>
  <section class="stage">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="1120" height="1120"></canvas>
      <button class="hub" id="hub">SPIN</button>
    </div>
    <button class="spin-btn" id="spinBtn">Snurra!</button>
    <div class="last" id="last"></div>
  </section>

  <aside class="panel">
    <div class="tabs">
      <button data-tab="names" class="active">Names</button>
      <button data-tab="colors">Colours</button>
      <button data-tab="text">Text</button>
      <button data-tab="history">History</button>
    </div>

    <!-- Names -->
    <div class="tab active" id="tab-names">
      <label class="lbl">Names on the wheel</label>
      <div class="names" id="nameList"></div>
      <div class="count" id="count"></div>
      <div class="btn-row">
        <button class="btn primary" id="addName">+ Add name</button>
        <button class="btn" id="shuffle">Shuffle</button>
        <button class="btn" id="clearAll">Clear all</button>
      </div>
      <label class="lbl">Paste many names (one per line)</label>
      <textarea id="bulk" placeholder="Alice&#10;Bob&#10;Charlie"></textarea>
      <div class="btn-row">
        <button class="btn" id="bulkReplace">Replace list</button>
        <button class="btn" id="bulkAdd">Add to list</button>
      </div>
      <label class="check"><input type="checkbox" id="removeWinner"> Remove name from wheel after it's picked</label>
    </div>

    <!-- Colours -->
    <div class="tab" id="tab-colors">
      <label class="lbl">Slice palette (applies to all slices)</label>
      <div class="palettes" id="palettes"></div>
      <p class="count">Tip: change any single slice's colour with the swatch next to its name in the Names tab.</p>
      <label class="lbl">Other colours</label>
      <div class="color-grid">
        <span>Page background</span><input type="color" id="cBg">
        <span>Slice text</span><input type="color" id="cSliceText">
        <span>Wheel border</span><input type="color" id="cBorder">
        <span>Pointer</span><input type="color" id="cPointer">
        <span>Centre button</span><input type="color" id="cHub">
        <span>Pop-up background</span><input type="color" id="cPopBg">
        <span>Pop-up text</span><input type="color" id="cPopText">
      </div>
      <label class="check"><input type="checkbox" id="winnerUseSlice" checked> Show picked name in its slice colour</label>
    </div>

    <!-- Text -->
    <div class="tab" id="tab-text">
      <label class="lbl">Wheel title</label>
      <input type="text" id="tTitle">
      <label class="lbl">Text before the name — first spin</label>
      <input type="text" id="tFirst" placeholder="e.g. First up is…">
      <label class="lbl">Text before the name — every later spin</label>
      <input type="text" id="tNext" placeholder="e.g. {previous} passes the turn to…">
      <p class="count">Use <b>{previous}</b> to insert the name picked on the spin before.</p>
      <label class="lbl">Text shown after the name (optional)</label>
      <input type="text" id="tPost" placeholder="e.g. Congratulations!">
      <label class="lbl">Spin duration (seconds)</label>
      <input type="number" id="tDur" min="1" max="20" step="0.5">
      <label class="check"><input type="checkbox" id="sound" checked> Tick sound while spinning</label>
      <label class="check"><input type="checkbox" id="confettiOn" checked> Confetti on result</label>
      <div class="btn-row"><button class="btn" id="resetAll">Reset to file settings</button></div>
    </div>

    <!-- History -->
    <div class="tab" id="tab-history">
      <label class="lbl">Previous picks (newest first)</label>
      <ul class="history" id="history"></ul>
      <div class="btn-row"><button class="btn" id="clearHistory">Clear history</button></div>
    </div>
  </aside>
</main>

<div class="overlay" id="overlay">
  <div class="popup" id="popup">
    <div class="pre" id="popPre"></div>
    <div class="winner" id="popName"></div>
    <div class="post" id="popPost"></div>
    <div class="btn-row">
      <button class="btn" id="popClose">Close</button>
      <button class="btn primary" id="popSpin">Spin again</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(() => {
  const PALETTES = {
    'Carnival': ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c'],
    'Pastel':   ['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#bdb2ff'],
    'Ocean':    ['#03045e','#0077b6','#00b4d8','#48cae4','#90e0ef','#023e8a'],
    'Sunset':   ['#f94144','#f3722c','#f8961e','#f9c74f','#e76f51','#d62828'],
    'Forest':   ['#2d6a4f','#40916c','#52b788','#74c69d','#1b4332','#95d5b2'],
    'Neon':     ['#ff00a0','#00e5ff','#aaff00','#ffea00','#b100ff','#ff5e00'],
    'Mono':     ['#222222','#444444','#666666','#888888','#aaaaaa','#333333'],
    'Red & Black': ['#c1121f','#111111'],
  };
  const CFG = window.WHEEL_CONFIG || {};
  const CC = CFG.colors || {};
  const pick = (v, d) => (v === undefined || v === null ? d : v);

  // Convert any CSS colour (e.g. "red") to #rrggbb so colour pickers & contrast work
  const probe = document.createElement('canvas').getContext('2d');
  function toHex(c, fallback) {
    if (c === 'auto') return 'auto';
    try { probe.fillStyle = '#000'; probe.fillStyle = c; const v = probe.fillStyle; return v.startsWith('#') ? v : fallback; }
    catch (e) { return fallback; }
  }
  const cfgSlice = (Array.isArray(CFG.sliceColors) && CFG.sliceColors.length)
    ? CFG.sliceColors.map(c => toHex(c, '#888888')) : null;
  if (cfgSlice) PALETTES['From file'] = cfgSlice;

  const DEFAULTS = {
    names: (Array.isArray(CFG.names) ? CFG.names : ['Alice','Bob','Charlie']).map(String),
    palette: cfgSlice ? 'From file' : 'Carnival',
    colors: {
      bg:        toHex(pick(CC.background, '#14121f'), '#14121f'),
      sliceText: toHex(pick(CC.sliceText, '#ffffff'), '#ffffff'),
      border:    toHex(pick(CC.wheelBorder, '#ffffff'), '#ffffff'),
      pointer:   toHex(pick(CC.pointer, '#ffffff'), '#ffffff'),
      hub:       toHex(pick(CC.centerButton, '#ffffff'), '#ffffff'),
      popBg:     toHex(pick(CC.popupBackground, '#1f1c2e'), '#1f1c2e'),
      popText:   toHex(pick(CC.popupText, '#f2f0fa'), '#f2f0fa'),
    },
    winnerUseSlice: pick(CFG.winnerInSliceColor, true),
    fish: pick(CFG.fish, true),
    title: pick(CFG.title, '🎡 Roulette Wheel'),
    first: pick(CFG.firstSpinText, pick(CFG.textBefore, "Let's begin! First up is…")),
    next: pick(CFG.nextSpinText, '{previous} passes the turn to…'),
    post: pick(CFG.textAfter, ''),
    duration: pick(CFG.spinSeconds, 5),
    sound: pick(CFG.sound, true),
    confetti: pick(CFG.confetti, true),
    removeWinner: pick(CFG.removeWinner, false),
  };

  // ---------- State (always starts from the config above) ----------
  let state;
  function fresh() {
    const s = JSON.parse(JSON.stringify(DEFAULTS));
    s.entries = s.names.map((n, i) => ({ name: n, color: PALETTES[s.palette][i % PALETTES[s.palette].length] }));
    delete s.names;
    s.history = [];
    return s;
  }
  function save() {}
  state = fresh();
  if (CFG.showSettingsPanel === false) {
    document.querySelector('aside.panel').style.display = 'none';
    document.querySelector('main').style.gridTemplateColumns = '1fr';
  }

  const $ = id => document.getElementById(id);
  const canvas = $('wheel'), ctx = canvas.getContext('2d');
  let rotation = 0, spinning = false;

  // ---------- Drawing ----------
  function readableOn(hex) {
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return (r*299 + g*587 + b*114) / 1000 > 150 ? '#14121f' : '#ffffff';
  }
  function draw() {
    const W = canvas.width, cx = W/2, cy = W/2, R = W/2 - 24;
    ctx.clearRect(0,0,W,W);
    const list = state.entries;
    const n = list.length;

    // outer ring
    ctx.beginPath(); ctx.arc(cx, cy, R + 14, 0, Math.PI*2);
    ctx.fillStyle = state.colors.border; ctx.fill();

    if (n === 0) {
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
      ctx.fillStyle = '#2a263d'; ctx.fill();
      ctx.fillStyle = '#a39fba'; ctx.font = '600 44px Outfit, sans-serif';
      ctx.textAlign = 'center'; ctx.fillText('Add some names →', cx, cy + R/2);
      return;
    }
    const arc = Math.PI*2 / n;
    for (let i = 0; i < n; i++) {
      const a0 = rotation + i*arc, a1 = a0 + arc;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
      ctx.fillStyle = list[i].color; ctx.fill();
      if (n > 1) { ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 3; ctx.stroke(); }

      // label, curved along the rim
      const mid = a0 + arc/2;
      const ink = state.colors.sliceText === 'auto' ? readableOn(list[i].color) : state.colors.sliceText;
      const maxArc = Math.min(arc * 0.84, Math.PI * 1.6);
      let size = Math.min(58, R * 0.1);
      const textR = () => R - 22 - size * 0.6;
      const font = () => `700 ${size}px Outfit, sans-serif`;
      let label = list[i].name || '';
      ctx.font = font();
      while (ctx.measureText(label).width / textR() > maxArc && size > 18) { size -= 2; ctx.font = font(); }
      if (ctx.measureText(label).width / textR() > maxArc) {
        while (label.length > 1 && ctx.measureText(label + '…').width / textR() > maxArc) label = label.slice(0, -1);
        label += '…';
      }
      const tr = textR();
      drawArcText(label, cx, cy, tr, mid, ink);

      // fish below the name
      if (state.fish) {
        const fishR = tr - size * 0.6 - 14;
        let s = Math.min(R * 0.09, fishR * arc * 0.34);
        if (s >= 7) {
          const fx = cx + Math.cos(mid) * (fishR - s * 0.6), fy = cy + Math.sin(mid) * (fishR - s * 0.6);
          ctx.save();
          ctx.translate(fx, fy); ctx.rotate(mid + Math.PI/2); ctx.scale(s, s);
          FISH[i % FISH.length](ink, list[i].color);
          ctx.restore();
        }
      }
    }
    // pegs
    for (let i = 0; i < n; i++) {
      const a = rotation + i*arc;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a)*(R+7), cy + Math.sin(a)*(R+7), 6, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
    }
  }

  // Draw text centred on angle `mid`, following a circle of radius r, letters upright facing outward
  function drawArcText(text, cx, cy, r, mid, color) {
    const chars = [...text];
    const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0);
    let ang = mid - (total / r) / 2;
    ctx.save();
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 4;
    chars.forEach((c, k) => {
      const a = ang + (widths[k] / 2) / r;
      ctx.save();
      ctx.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.rotate(a + Math.PI/2);
      ctx.fillText(c, 0, 0);
      ctx.restore();
      ang += widths[k] / r;
    });
    ctx.restore();
  }

  // ---------- Fish icons (unit size: about 2 wide, centred on 0,0, facing right) ----------
  function eye(x, y, r, col) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = col; ctx.fill();
  }
  const FISH = [
    // 1. Classic fish
    (ink, bg) => {
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.ellipse(0.15, 0, 0.75, 0.42, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.5, 0); ctx.lineTo(-1, -0.4); ctx.lineTo(-1, 0.4); ctx.closePath(); ctx.fill();
      eye(0.55, -0.1, 0.09, bg);
    },
    // 2. Angelfish
    (ink, bg) => {
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.moveTo(0.8, 0); ctx.quadraticCurveTo(0.2, -0.55, -0.3, -0.9);
      ctx.quadraticCurveTo(-0.25, -0.3, -0.55, 0); ctx.quadraticCurveTo(-0.25, 0.3, -0.3, 0.9);
      ctx.quadraticCurveTo(0.2, 0.55, 0.8, 0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.5, 0); ctx.lineTo(-0.95, -0.3); ctx.lineTo(-0.95, 0.3); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = bg; ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.moveTo(0.1, -0.38); ctx.lineTo(0.1, 0.38); ctx.moveTo(-0.15, -0.42); ctx.lineTo(-0.15, 0.42); ctx.stroke();
      eye(0.5, -0.08, 0.08, bg);
    },
    // 3. Pufferfish
    (ink, bg) => {
      ctx.fillStyle = ink; ctx.strokeStyle = ink; ctx.lineWidth = 0.08; ctx.lineCap = 'round';
      for (let k = 0; k < 12; k++) {
        const a = k / 12 * Math.PI * 2;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*0.5, Math.sin(a)*0.5); ctx.lineTo(Math.cos(a)*0.72, Math.sin(a)*0.72); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0.1, 0, 0.55, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.4, 0); ctx.lineTo(-0.9, -0.3); ctx.lineTo(-0.9, 0.3); ctx.closePath(); ctx.fill();
      eye(0.35, -0.15, 0.1, bg);
      ctx.beginPath(); ctx.arc(0.62, 0.08, 0.07, 0, Math.PI*2); ctx.fillStyle = bg; ctx.fill();
    },
    // 4. Clownfish (striped)
    (ink, bg) => {
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.ellipse(0.1, 0, 0.72, 0.38, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.5, 0); ctx.quadraticCurveTo(-1.05, -0.55, -0.95, 0); ctx.quadraticCurveTo(-1.05, 0.55, -0.5, 0); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0.05, -0.38, 0.3, 0.12, 0, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = bg; ctx.lineWidth = 0.1;
      ctx.beginPath(); ctx.moveTo(0.38, -0.33); ctx.quadraticCurveTo(0.3, 0, 0.38, 0.33);
      ctx.moveTo(-0.1, -0.37); ctx.quadraticCurveTo(-0.18, 0, -0.1, 0.37); ctx.stroke();
      eye(0.58, -0.08, 0.07, bg);
    },
    // 5. Shark
    (ink, bg) => {
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.moveTo(1, 0.05); ctx.quadraticCurveTo(0.6, -0.32, 0, -0.27);
      ctx.lineTo(-0.15, -0.6); ctx.lineTo(-0.3, -0.22); ctx.quadraticCurveTo(-0.6, -0.12, -0.7, -0.05);
      ctx.lineTo(-1, -0.45); ctx.lineTo(-0.88, 0.02); ctx.lineTo(-1, 0.35); ctx.lineTo(-0.7, 0.06);
      ctx.quadraticCurveTo(-0.2, 0.25, 0.1, 0.22); ctx.lineTo(0.05, 0.42); ctx.lineTo(0.3, 0.2);
      ctx.quadraticCurveTo(0.8, 0.2, 1, 0.05); ctx.fill();
      eye(0.68, -0.06, 0.06, bg);
    },
    // 6. Swordfish
    (ink, bg) => {
      ctx.fillStyle = ink; ctx.strokeStyle = ink; ctx.lineWidth = 0.07; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0.45, -0.02); ctx.lineTo(1.05, -0.02); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, 0.55, 0.22, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0.2, -0.18); ctx.quadraticCurveTo(0, -0.62, -0.2, -0.2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.45, 0); ctx.lineTo(-0.9, -0.42); ctx.lineTo(-0.72, 0); ctx.lineTo(-0.9, 0.42); ctx.closePath(); ctx.fill();
      eye(0.35, -0.06, 0.06, bg);
    },
    // 7. Goldfish (fancy tail)
    (ink, bg) => {
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.ellipse(0.25, 0, 0.55, 0.42, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.2, 0);
      ctx.bezierCurveTo(-0.6, -0.7, -1.1, -0.5, -0.95, -0.15);
      ctx.quadraticCurveTo(-0.7, 0, -0.95, 0.15);
      ctx.bezierCurveTo(-1.1, 0.5, -0.6, 0.7, -0.2, 0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0.3, -0.38); ctx.quadraticCurveTo(0.05, -0.75, -0.15, -0.3); ctx.fill();
      eye(0.55, -0.1, 0.09, bg);
    },
    // 8. Round tropical fish with spots
    (ink, bg) => {
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.moveTo(0.85, 0); ctx.bezierCurveTo(0.6, -0.7, -0.3, -0.65, -0.5, 0);
      ctx.bezierCurveTo(-0.3, 0.65, 0.6, 0.7, 0.85, 0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.45, 0); ctx.lineTo(-0.95, -0.35); ctx.quadraticCurveTo(-0.8, 0, -0.95, 0.35); ctx.closePath(); ctx.fill();
      [[-0.1, -0.15], [0.15, 0.2], [-0.2, 0.18], [0.1, -0.3]].forEach(([x, y]) => eye(x, y, 0.06, bg));
      eye(0.55, -0.08, 0.08, bg);
    },
  ];

  function indexAtPointer(rot) {
    const n = state.entries.length, arc = Math.PI*2 / n;
    let a = (-Math.PI/2 - rot) % (Math.PI*2);
    if (a < 0) a += Math.PI*2;
    return Math.floor(a / arc) % n;
  }

  // ---------- Sound ----------
  let audioCtx = null;
  function tick() {
    if (!state.sound || !audioCtx) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 900 + Math.random()*200;
      g.gain.setValueAtTime(0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.05);
    } catch (e) {}
  }
  function fanfare() {
    if (!state.sound || !audioCtx) return;
    try {
      [523, 659, 784, 1047].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        const t = audioCtx.currentTime + i*0.09;
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.4);
      });
    } catch (e) {}
  }

  // ---------- Spin ----------
  function spin() {
    if (spinning || state.entries.length === 0) return;
    closePopup();
    if (state.sound && !audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    spinning = true; setSpinUI(true);
    const start = rotation;
    const extra = Math.PI*2 * (5 + Math.random()*3) + Math.random()*Math.PI*2;
    const end = start + extra;
    const dur = Math.max(1, Math.min(20, +state.duration || 5)) * 1000;
    const t0 = performance.now();
    let lastIdx = indexAtPointer(start);
    const ease = t => 1 - Math.pow(1 - t, 4);
    function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      rotation = start + extra * ease(t);
      const idx = indexAtPointer(rotation);
      if (idx !== lastIdx) { tick(); lastIdx = idx; }
      draw();
      if (t < 1) requestAnimationFrame(frame);
      else {
        rotation = end % (Math.PI*2);
        spinning = false; setSpinUI(false);
        finish(indexAtPointer(rotation));
      }
    }
    requestAnimationFrame(frame);
  }
  function setSpinUI(on) { $('spinBtn').disabled = on; $('hub').disabled = on; $('popSpin').disabled = on; }

  let pendingRemoval = null;
  function finish(idx) {
    const w = state.entries[idx];
    state.history.unshift({ name: w.name, color: w.color, time: Date.now() });
    if (state.history.length > 200) state.history.length = 200;
    $('last').innerHTML = `Last pick: <b></b>`; $('last').querySelector('b').textContent = w.name;
    showPopup(w);
    fanfare();
    if (state.confetti) confetti(w.color);
    pendingRemoval = state.removeWinner ? idx : null;
    renderHistory(); save();
  }

  // ---------- Popup ----------
  function showPopup(w) {
    const prev = state.history[1];   // history[0] is the pick just made
    const pre = prev ? state.next.split('{previous}').join(prev.name) : state.first;
    $('popPre').textContent = pre;
    $('popPre').style.display = pre ? '' : 'none';
    $('popName').textContent = w.name;
    $('popPost').textContent = state.post;
    $('popPost').style.display = state.post ? '' : 'none';
    const p = $('popup');
    p.style.setProperty('--wincolor', state.winnerUseSlice ? w.color : state.colors.popText);
    p.style.animation = 'none'; void p.offsetWidth; p.style.animation = '';
    $('overlay').classList.add('show');
  }
  function closePopup() {
    $('overlay').classList.remove('show');
    if (pendingRemoval !== null) {
      state.entries.splice(pendingRemoval, 1);
      pendingRemoval = null;
      renderNames(); draw(); save();
    }
  }
  $('popClose').onclick = closePopup;
  $('overlay').onclick = e => { if (e.target === $('overlay')) closePopup(); };
  $('popSpin').onclick = () => { closePopup(); setTimeout(spin, 50); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePopup();
  });

  // ---------- Confetti ----------
  const cc = $('confetti'), cctx = cc.getContext('2d');
  let parts = [], confettiRunning = false;
  function confetti(main) {
    cc.width = innerWidth; cc.height = innerHeight;
    const cols = [main, '#ffffff', '#ffcc33', ...state.entries.slice(0,5).map(e => e.color)];
    for (let i = 0; i < 160; i++) {
      parts.push({
        x: innerWidth/2 + (Math.random()-.5)*200, y: innerHeight/2 - 60,
        vx: (Math.random()-.5)*18, vy: -Math.random()*16 - 4,
        r: Math.random()*Math.PI, vr: (Math.random()-.5)*.4,
        w: 6 + Math.random()*8, h: 4 + Math.random()*6,
        c: cols[Math.floor(Math.random()*cols.length)], life: 0
      });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(stepConfetti); }
  }
  function stepConfetti() {
    cctx.clearRect(0,0,cc.width,cc.height);
    parts.forEach(p => {
      p.vy += 0.45; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r);
      cctx.fillStyle = p.c; cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); cctx.restore();
    });
    parts = parts.filter(p => p.y < cc.height + 40 && p.life < 400);
    if (parts.length) requestAnimationFrame(stepConfetti);
    else { confettiRunning = false; cctx.clearRect(0,0,cc.width,cc.height); }
  }

  // ---------- Names UI ----------
  function nextColor(i) { const p = PALETTES[state.palette] || PALETTES.Carnival; return p[i % p.length]; }
  function renderNames() {
    const box = $('nameList'); box.innerHTML = '';
    state.entries.forEach((e, i) => {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<span class="num">${i+1}</span>
        <input type="color" title="Slice colour">
        <input type="text" placeholder="Name">
        <button class="icon-btn" title="Remove">✕</button>`;
      const [col, txt] = row.querySelectorAll('input');
      col.value = e.color; txt.value = e.name;
      col.oninput = () => { e.color = col.value; draw(); save(); };
      txt.oninput = () => { e.name = txt.value; draw(); save(); };
      txt.onkeydown = ev => { if (ev.key === 'Enter') { addName(i+1); } };
      row.querySelector('button').onclick = () => { if (spinning) return; state.entries.splice(i,1); renderNames(); draw(); save(); };
      box.appendChild(row);
    });
    $('count').textContent = `${state.entries.length} name${state.entries.length === 1 ? '' : 's'} on the wheel`;
  }
  function addName(at) {
    if (spinning) return;
    const idx = at ?? state.entries.length;
    state.entries.splice(idx, 0, { name: '', color: nextColor(idx) });
    renderNames(); draw(); save();
    const inputs = $('nameList').querySelectorAll('input[type=text]');
    inputs[idx] && inputs[idx].focus();
  }
  $('addName').onclick = () => addName();
  $('shuffle').onclick = () => {
    if (spinning) return;
    const a = state.entries;
    for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; }
    renderNames(); draw(); save();
  };
  $('clearAll').onclick = () => { if (spinning) return; state.entries = []; renderNames(); draw(); save(); };
  function parseBulk() { return $('bulk').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean); }
  $('bulkReplace').onclick = () => {
    if (spinning) return; const ns = parseBulk(); if (!ns.length) return;
    state.entries = ns.map((n, i) => ({ name: n, color: nextColor(i) }));
    $('bulk').value = ''; renderNames(); draw(); save();
  };
  $('bulkAdd').onclick = () => {
    if (spinning) return; const ns = parseBulk(); if (!ns.length) return;
    const s = state.entries.length;
    ns.forEach((n, i) => state.entries.push({ name: n, color: nextColor(s+i) }));
    $('bulk').value = ''; renderNames(); draw(); save();
  };
  $('removeWinner').onchange = e => { state.removeWinner = e.target.checked; save(); };

  // ---------- Colours UI ----------
  function renderPalettes() {
    const box = $('palettes'); box.innerHTML = '';
    Object.entries(PALETTES).forEach(([name, cols]) => {
      const b = document.createElement('button'); b.className = 'pal';
      b.innerHTML = `${name}<div class="sw">${cols.map(c => `<span style="background:${c}"></span>`).join('')}</div>`;
      if (name === state.palette) b.style.borderColor = 'var(--accent)';
      b.onclick = () => {
        state.palette = name;
        state.entries.forEach((e, i) => e.color = cols[i % cols.length]);
        renderPalettes(); renderNames(); draw(); save();
      };
      box.appendChild(b);
    });
  }
  const colorMap = { cBg:'bg', cSliceText:'sliceText', cBorder:'border', cPointer:'pointer', cHub:'hub', cPopBg:'popBg', cPopText:'popText' };
  function applyColors() {
    const c = state.colors, root = document.documentElement.style;
    root.setProperty('--bg', c.bg);
    root.setProperty('--pointer', c.pointer);
    root.setProperty('--hub', c.hub);
    root.setProperty('--hubtext', readableOn(c.hub));
    root.setProperty('--popbg', c.popBg);
    root.setProperty('--poptext', c.popText);
  }
  Object.entries(colorMap).forEach(([id, key]) => {
    const el = $(id);
    el.oninput = () => { state.colors[key] = el.value; applyColors(); draw(); save(); };
  });
  $('winnerUseSlice').onchange = e => { state.winnerUseSlice = e.target.checked; save(); };

  // ---------- Text UI ----------
  $('tTitle').oninput = e => { state.title = e.target.value; $('title').textContent = state.title; document.title = state.title || 'Roulette Wheel'; save(); };
  $('tFirst').oninput = e => { state.first = e.target.value; save(); };
  $('tNext').oninput = e => { state.next = e.target.value; save(); };
  $('tPost').oninput = e => { state.post = e.target.value; save(); };
  $('tDur').oninput = e => { state.duration = e.target.value; save(); };
  $('sound').onchange = e => { state.sound = e.target.checked; save(); };
  $('confettiOn').onchange = e => { state.confetti = e.target.checked; save(); };
  let resetArmed = false;
  $('resetAll').onclick = () => {
    if (spinning) return;
    if (!resetArmed) { resetArmed = true; $('resetAll').textContent = 'Click again to confirm reset'; setTimeout(() => { resetArmed = false; $('resetAll').textContent = 'Reset to file settings'; }, 3000); return; }
    resetArmed = false; $('resetAll').textContent = 'Reset to file settings';
    state = fresh(); rotation = 0; syncForm(); save();
  };

  // ---------- History ----------
  function renderHistory() {
    const ul = $('history'); ul.innerHTML = '';
    if (!state.history.length) { ul.innerHTML = '<li class="empty" style="background:none;padding:0">No spins yet.</li>'; return; }
    state.history.forEach((h, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="n">#${state.history.length - i}</span><span class="dot"></span><span class="nm"></span>`;
      li.querySelector('.dot').style.background = h.color;
      li.querySelector('.nm').textContent = h.name;
      ul.appendChild(li);
    });
  }
  $('clearHistory').onclick = () => { state.history = []; renderHistory(); $('last').textContent = ''; save(); };

  // ---------- Tabs ----------
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + b.dataset.tab));
  });

  // ---------- Init ----------
  function syncForm() {
    Object.entries(colorMap).forEach(([id, key]) => $(id).value = state.colors[key]);
    $('winnerUseSlice').checked = state.winnerUseSlice;
    $('tTitle').value = state.title; $('title').textContent = state.title; document.title = state.title || 'Roulette Wheel';
    $('tFirst').value = state.first; $('tNext').value = state.next; $('tPost').value = state.post; $('tDur').value = state.duration;
    $('sound').checked = state.sound; $('confettiOn').checked = state.confetti;
    $('removeWinner').checked = state.removeWinner;
    if (state.history.length) { $('last').innerHTML = 'Last pick: <b></b>'; $('last').querySelector('b').textContent = state.history[0].name; }
    else $('last').textContent = '';
    applyColors(); renderPalettes(); renderNames(); renderHistory(); draw();
  }
  $('spinBtn').onclick = spin;
  $('hub').onclick = spin;
  syncForm();
  if (document.fonts) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
