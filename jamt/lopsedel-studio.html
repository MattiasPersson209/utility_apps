</script>
<style>
:root{
  --bg:#111110; --panel:#191918; --card:#212120; --card2:#262625; --line:#2f2f2d;
  --fg:#ecebe6; --mut:#8e8d87; --hi:#FFD60A; --sel:#2E9BFF; --danger:#ff5a4e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{height:56px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:#0c0c0b}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;white-space:nowrap}
.logo b{font:400 22px/1 Anton,Impact,sans-serif;letter-spacing:.5px;background:var(--hi);color:#111;padding:6px 8px 5px}
.logo span{font:400 22px/1 Anton,Impact,sans-serif;letter-spacing:.5px}
.btn{background:transparent;border:1px solid var(--line);border-radius:7px;padding:7px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#55554f;background:#1d1d1c}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--hi);border-color:var(--hi);color:#111;font-weight:600}
.btn.primary:hover{background:#ffe04a}
.btn.icon{padding:7px 9px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.app{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 56px)}
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:13px 4px 11px;color:var(--mut);font-weight:500}
.tab.on{color:var(--fg);border-bottom-color:var(--hi)}
.pbody{overflow:auto;padding:14px;flex:1}
.stage{position:relative;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 1px 1px,#2a2a28 1px,transparent 1.2px) 0 0/18px 18px,#141413}
#poster{box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05);touch-action:none;cursor:default}
.stage .tip{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:var(--mut);font-size:12px;pointer-events:none}
.stage.drop::after{content:"Drop image";position:absolute;inset:14px;border:2px dashed var(--hi);border-radius:14px;display:grid;place-items:center;font:400 32px Anton,sans-serif;color:var(--hi);background:rgba(0,0,0,.4)}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:18px 0 9px;font-weight:600}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#0f0f0e;border:1px solid var(--line);border-radius:7px;padding:2px}

.cp{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sw{width:26px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.18);padding:0}
.sw.on,.cp input.on{outline:2px solid var(--hi);outline-offset:2px}
.sw.none{background:#0f0f0e linear-gradient(135deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%)}
.cp input[type=color]{width:34px;height:24px;border:1px solid var(--line);border-radius:6px;background:none;padding:1px;cursor:pointer}

.addrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.card.sel{border-color:#6b6216;background:var(--card2)}
.card-h{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;cursor:pointer}
.card-h .ic{width:24px;height:24px;border-radius:6px;background:#33332f;display:grid;place-items:center;font:400 13px Anton,sans-serif;flex:none}

@media (max-width:900px){
  body{overflow:auto}
  header{flex-wrap:wrap;height:auto;padding:8px 10px}
  .logo{width:100%}
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:74vh;order:-1}
  .panel{border-right:0;border-top:1px solid var(--line)}
  .pbody{overflow:visible}
  .btn .lb{display:none}
}
</style>

<body>
<header>
  <div class="logo"><b>LÖPSEDEL</b><span>STUDIO</span></div>
  <button class="btn icon" id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button class="btn icon" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <div class="sep"></div>
  <button class="btn" id="newBtn" title="New poster">＋ <span class="lb">New</span></button>
  <button class="btn" id="openBtn" title="Open a saved project (.json)">⤒ <span class="lb">Open</span></button>
  <button class="btn" id="saveBtn" title="Save project to a file (.json)">⤓ <span class="lb">Save project</span></button>
  <button class="btn primary" id="exportBtn">Export</button>
</header>
<div class="app">
  <aside class="panel">
    <nav class="tabs">
      <button class="tab" data-tab="content">Content</button>
      <button class="tab" data-tab="paper">Masthead</button>
      <button class="tab" data-tab="look">Look</button>
    </nav>
    <div class="pbody" id="pbody"></div>
  </aside>
  <main class="stage" id="stage">
    <canvas id="poster"></canvas>
    <div class="tip">Click a part of the poster to edit it · drag the splash · drop an image here</div>
  </main>
</div>
<input type="file" id="imgInput" accept="image/*" class="hide">
<input type="file" id="jsonInput" accept=".json,application/json" class="hide">
<div id="toast"></div>

<script>
/* ---------- constants ---------- */
const W = 1000, H = 1414; // A-series ratio (1:√2), base units
const FONTS = [
  {name:'Anton', w:400}, {name:'League Gothic', w:400}, {name:'Bebas Neue', w:400},
  {name:'Oswald', w:700}, {name:'Barlow Condensed', w:900}, {name:'Archivo Black', w:400},
  {name:'Playfair Display', w:900}, {name:'Abril Fatface', w:400}, {name:'UnifrakturMaguntia', w:400}
];
const fontW = n => (FONTS.find(f => f.name === n) || FONTS[0]).w;
const fstr = (n, s) => `${fontW(n)} ${s}px "${n}", Impact, "Arial Narrow", sans-serif`;

const THEMES = [
  {name:'Evening yellow', look:{bg:'#FFE500',text:'#111111',accent:'#D6001C'}, paper:{font:'Anton',bg:'A',color:'#FFFFFF',dateBg:'#111111',dateColor:'#FFFFFF',footerBg:'T',footerColor:'B'}},
  {name:'White & red', look:{bg:'#FFFFFF',text:'#111111',accent:'#E1001A'}, paper:{font:'Anton',bg:'A',color:'#FFFFFF',dateBg:'#111111',dateColor:'#FFFFFF',footerBg:'A',footerColor:'#FFFFFF'}},
  {name:'Breaking', look:{bg:'#111111',text:'#FFFFFF',accent:'#FFE500'}, paper:{font:'Anton',bg:'#D6001C',color:'#FFFFFF',dateBg:'#FFE500',dateColor:'#111111',footerBg:'A',footerColor:'#111111'}},
  {name:'Sport', look:{bg:'#FFFFFF',text:'#0E1B12',accent:'#00853F'}, paper:{font:'League Gothic',bg:'A',color:'#FFFFFF',dateBg:'#0E1B12',dateColor:'#FFFFFF',footerBg:'A',footerColor:'#FFFFFF'}},
  {name:'Morning blue', look:{bg:'#F3EFE6',text:'#132A4A',accent:'#2156A5'}, paper:{font:'Playfair Display',bg:'none',color:'T',dateBg:'T',dateColor:'B',footerBg:'T',footerColor:'B'}},
  {name:'Business', look:{bg:'#F6D7C6',text:'#231F20',accent:'#9B1B30'}, paper:{font:'Abril Fatface',bg:'T',color:'B',dateBg:'A',dateColor:'#FFFFFF',footerBg:'T',footerColor:'B'}},
  {name:'Local classic', look:{bg:'#FFFDF6',text:'#1A1A1A',accent:'#B3261E'}, paper:{font:'UnifrakturMaguntia',bg:'none',color:'T',dateBg:'T',dateColor:'B',footerBg:'A',footerColor:'#FFFFFF'}},
  {name:'Pop', look:{bg:'#FF2E88',text:'#111111',accent:'#FFFFFF'}, paper:{font:'Archivo Black',bg:'T',color:'B',dateBg:'#FFFFFF',dateColor:'#111111',footerBg:'T',footerColor:'#FFFFFF'}},
];

/* ---------- state ---------- */
let seq = 1;
const nid = () => 'b' + Date.now().toString(36) + (seq++);
const textBlock = o => Object.assign({id:nid(),type:'text',text:'NY RUBRIK',font:'Anton',color:'T',hl:'A',bg:'none',upper:true,fill:true,max:420,size:80,align:'center',lg:12,pad:18}, o);
const labelBlock = o => textBlock(Object.assign({text:'JUST NU',font:'Oswald',color:'B',hl:'T',bg:'A',fill:false,size:54,pad:14,lg:6}, o));
const imageBlock = o => Object.assign({id:nid(),type:'image',img:null,h:30,w:100,fx:50,fy:50,zoom:100,gray:false,frame:0}, o);
const ruleBlock = o => Object.assign({id:nid(),type:'rule',t:10,color:'T'}, o);

const STARTERS = {
  'News': () => ({blocks:[
    labelBlock({text:'JUST NU',bg:'T',hl:'A'}),
    textBlock({text:'STORMEN\n*SLÅR TILL*\nMOT KUSTEN',lg:14}),
    ruleBlock(),
    textBlock({text:'Tusentals utan ström\nSå skyddar du ditt hem',font:'Barlow Condensed',max:110,lg:8}),
    textBlock({text:'BÄSTA *JULKLAPPARNA*\nUNDER 200 KR',bg:'A',color:'B',hl:'T',max:130,pad:22,lg:10}),
  ], splash:false, footer:'ALLT OM STORMEN – SIDAN 6–11'}),
  'Sport': () => ({blocks:[
    labelBlock({text:'SPORT'}),
    textBlock({text:'GULDET\n*HEM*\nTILL SVERIGE',lg:12}),
    imageBlock({h:26}),
    textBlock({text:'Så såg det ut – alla bilderna',font:'Barlow Condensed',max:90}),
  ], splash:false, footer:''}),
  'Consumer': () => ({blocks:[
    textBlock({text:'STORA\n*MAT*TESTET',lg:10}),
    labelBlock({text:'BARA I DAG',bg:'T',hl:'A'}),
    textBlock({text:'17 SORTERS KAFFE\nHÄR ÄR *VINNAREN*',font:'Barlow Condensed',max:150,lg:8}),
  ], splash:true, footer:'BILAGA: HELA JULMENYN'}),
};

function defaultState(){
  const st = STARTERS['News']();
  return {
    paper:{show:true,name:'MIN TIDNING',font:'Anton',color:'#FFFFFF',bg:'A',height:150,style:'full',align:'center',
      showDate:true,date:'',price:'PRIS 25 KR',dateBg:'#111111',dateColor:'#FFFFFF',footer:st.footer,footerBg:'T',footerColor:'B'},
    look:{bg:'#FFE500',text:'#111111',accent:'#D6001C',pad:40,gap:18,dist:'spread',border:0},
    splash:{on:st.splash,text:'NYTT\nIDAG',bg:'A',color:'#FFFFFF',x:78,y:60,size:230,rot:-12},
    blocks:st.blocks
  };
}

let state, images = {}, imgCache = {};
let sel = null, tab = 'content';
let lastLayout = null;
const dl = {ns:null};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})){
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
const col = v => v === 'T' ? state.look.text : v === 'A' ? state.look.accent : v === 'B' ? state.look.bg : v;
const mctx = document.createElement('canvas').getContext('2d');
function meas(t, font){ mctx.font = font; const m = mctx.measureText(t); return {w:m.width, a:m.actualBoundingBoxAscent || 0, d:Math.max(0, m.actualBoundingBoxDescent || 0)}; }
function parseSegs(line){
  const out = []; line.split('*').forEach((t, i) => { if (t) out.push({t, hl: i % 2 === 1}); }); return out;
}
const dateText = () => (state.paper.date || new Date().toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})).toUpperCase();
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function getImg(id){
  if (!id || !images[id]) return null;
  let im = imgCache[id];
  if (!im){ im = new Image(); im.onload = render; im.src = images[id]; imgCache[id] = im; }
  return im.complete && im.naturalWidth ? im : null;
}

/* ---------- layout ---------- */
function measureBlock(b, CW){
  const hasBg = b.bg !== 'none';
  const padH = hasBg ? b.pad : 0, padV = hasBg ? b.pad * 0.75 : 0;
  const IW = Math.max(10, CW - 2 * padH);
  const f100 = fstr(b.font, 100), cap = meas('H', f100).a;
  const raw = (b.upper ? b.text.toUpperCase() : b.text).split('\n');
  const lines = []; let content = 0;
  raw.forEach(ln => {
    const segs = parseSegs(ln);
    if (!segs.map(s => s.t).join('').trim()){ const h = (b.fill ? 40 : b.size * 0.4); lines.push({empty:true, h}); return; }
    let w = 0, a = cap, d = 0;
    segs.forEach(s => { const m = meas(s.t, f100); w += m.w; a = Math.max(a, m.a); d = Math.max(d, m.d); });
    const size = b.fill ? Math.min(IW / w * 100, b.max) : Math.min(b.size, IW / w * 100);
    const k = size / 100;
    lines.push({segs, size, w: w * k, a: a * k, d: d * k});
  });
  lines.forEach((L, i) => { content += L.empty ? L.h : L.a + L.d; if (i) content += b.lg; });
  return {lines, content: Math.max(content, 1), padH, padV, hasBg};
}

function computeLayout(){
  const P = state.paper, L = state.look, pad = L.pad;
  const inset = P.style === 'inset';
  const mx = inset ? pad : 0, mw = inset ? W - 2 * pad : W;
  const R = {};
  let y = inset ? pad : 0;
  if (P.show){ R.mast = {x:mx, y, w:mw, h:P.height}; y += P.height; }
  if (P.showDate){ R.date = {x:mx, y, w:mw, h:48}; y += 48; }
  const top = (P.show || P.showDate) ? y + pad * 0.7 : pad;
  let bottom = H - pad;
  if (P.footer && P.footer.trim()){
    const fh = 72, fy = H - (inset ? pad : 0) - fh;
    R.foot = {x:mx, y:fy, w:mw, h:fh}; bottom = fy - pad * 0.7;
  }
  const x0 = pad, CW = W - 2 * pad;
  const items = state.blocks.map(b => {
    if (b.type === 'text'){ const M = measureBlock(b, CW); return b.fill ? {b, M, v:M.content, f:2 * M.padV} : {b, M, v:0, f:M.content + 2 * M.padV}; }
    if (b.type === 'image') return {b, v:0, f:b.h / 100 * H};
    return {b, v:0, f:b.t};
  });
  const n = items.length, A = bottom - top, gaps = L.gap * Math.max(0, n - 1);
  const sv = items.reduce((a, i) => a + i.v, 0), sf = items.reduce((a, i) => a + i.f, 0);
  let s = 1;
  if (sv > 0 && sv + sf + gaps > A) s = Math.max(0.12, (A - sf - gaps) / sv);
  const extra = Math.max(0, A - (sv * s + sf + gaps));
  let gap = L.gap, yy = top;
  if (L.dist === 'spread' && n > 1) gap += extra / (n - 1);
  else if (L.dist === 'center' || (L.dist === 'spread' && n === 1)) yy += extra / 2;
  else if (L.dist === 'bottom') yy += extra;
  R.blocks = items.map(it => { const h = it.v * s + it.f; const r = Object.assign({}, it, {s: it.b.fill ? s : 1, x:x0, y:yy, w:CW, h}); yy += h + gap; return r; });
  return R;
}

/* ---------- drawing ---------- */
function fitText(ctx, text, font, box, align, maxFrac){
  const m = meas(text, fstr(font, 100));
  if (!m.w) return;
  const size = Math.min((box.w * 0.92) / m.w * 100, (box.h * (maxFrac || 0.72)) / Math.max(1, m.a + m.d) * 100);
  const k = size / 100;
  ctx.font = fstr(font, size);
  const by = box.y + (box.h - (m.a + m.d) * k) / 2 + m.a * k;
  const x = align === 'left' ? box.x + box.pl : box.x + (box.w - m.w * k) / 2;
  ctx.fillText(text, x, by);
}

function drawTextBlock(ctx, r){
  const b = r.b, M = r.M, s = r.s;
  if (M.hasBg){ ctx.fillStyle = col(b.bg); ctx.fillRect(r.x, r.y, r.w, r.h); }
  let cy = r.y + M.padV;
  M.lines.forEach((L, i) => {
    if (i) cy += b.lg * s;
    if (L.empty){ cy += L.h * s; return; }
    const lw = L.w * s, size = L.size * s;
    let x = b.align === 'left' ? r.x + M.padH : b.align === 'right' ? r.x + r.w - M.padH - lw : r.x + (r.w - lw) / 2;
    const base = cy + L.a * s;
    ctx.font = fstr(b.font, size);
    L.segs.forEach(sg => { ctx.fillStyle = col(sg.hl ? b.hl : b.color); ctx.fillText(sg.t, x, base); x += ctx.measureText(sg.t).width; });
    cy += (L.a + L.d) * s;
  });
}

function drawImageBlock(ctx, r, editing){
  const b = r.b, w = r.w * b.w / 100, x = r.x + (r.w - w) / 2, y = r.y, h = r.h;
  const im = getImg(b.img);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  if (im){
    const k = Math.max(w / im.naturalWidth, h / im.naturalHeight) * (b.zoom / 100);
    const dw = im.naturalWidth * k, dh = im.naturalHeight * k;
    if (b.gray) ctx.filter = 'grayscale(1) contrast(1.08)';
    ctx.drawImage(im, x + (w - dw) * b.fx / 100, y + (h - dh) * b.fy / 100, dw, dh);
    ctx.filter = 'none';
  } else if (editing){
    ctx.fillStyle = 'rgba(0,0,0,.07)'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 6;
    for (let i = -h; i < w; i += 34){ ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke(); }
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.font = fstr('Oswald', 30); ctx.textAlign = 'center';
    ctx.fillText('DOUBLE-CLICK OR DROP AN IMAGE', x + w / 2, y + h / 2 + 10); ctx.textAlign = 'left';
  }
  ctx.restore();
  if (b.frame > 0){ ctx.lineWidth = b.frame; ctx.strokeStyle = col('T'); ctx.strokeRect(x + b.frame / 2, y + b.frame / 2, w - b.frame, h - b.frame); }
}

function drawSplash(ctx){
  const S = state.splash; if (!S.on) return;
  const cx = S.x / 100 * W, cy = S.y / 100 * H, R = S.size / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(S.rot * Math.PI / 180);
  ctx.beginPath(); const N = 22;
  for (let i = 0; i < N * 2; i++){ const rr = i % 2 ? R * 0.85 : R, a = i * Math.PI / N; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = col(S.bg); ctx.fill();
  const lines = S.text.toUpperCase().split('\n').filter(l => l.trim());
  if (lines.length){
    const box = R * 1.18, f100 = fstr('Anton', 100), cap = meas('H', f100).a;
    const ms = lines.map(l => meas(l, f100));
    let ks = ms.map(m => Math.min(box / m.w, box * 0.55 / 100));
    const gap = 6;
    let tot = ms.reduce((a, m, i) => a + (Math.max(m.a, cap) + m.d) * ks[i], 0) + gap * (lines.length - 1);
    if (tot > box){ const f = box / tot; ks = ks.map(k => k * f); tot = box; }
    let y = -tot / 2; ctx.fillStyle = col(S.color);
    lines.forEach((l, i) => {
      const m = ms[i], k = ks[i], a = Math.max(m.a, cap) * k;
      ctx.font = fstr('Anton', 100 * k); ctx.fillText(l, -m.w * k / 2, y + a);
      y += a + m.d * k + gap;
    });
  }
  ctx.restore();
}

function draw(ctx, scale, editing){
  const P = state.paper, L = state.look;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillStyle = L.bg; ctx.fillRect(0, 0, W, H);
  const R = computeLayout(); lastLayout = R;

}

let pickTarget = null;
function pickImage(b){ pickTarget = b || null; $('#imgInput').value = ''; $('#imgInput').click(); }
function readImage(file, target){
  if (!file || !file.type.startsWith('image/')) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      let src = fr.result; const MAX = 3200;
      if (im.naturalWidth > MAX || im.naturalHeight > MAX || file.size > 4e6){
        const k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); src = c.toDataURL('image/jpeg', 0.9);
      }
      const id = nid(); images[id] = src;
      if (target){ target.img = id; sel = target.id; tab = 'content'; changed(true); commit(); }
      else insertBlock(imageBlock({img:id}));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- canvas interaction ---------- */
const cv = $('#poster');
function toBase(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H}; }
function hit(pt){
  const S = state.splash;
  if (S.on && Math.hypot(pt.x - S.x / 100 * W, pt.y - S.y / 100 * H) < S.size / 2) return {kind:'splash'};
  const R = lastLayout; if (!R) return null;
  for (const r of R.blocks) if (pt.y >= r.y - 6 && pt.y <= r.y + r.h + 6 && pt.x >= r.x - 6 && pt.x <= r.x + r.w + 6) return {kind:'block', b:r.b};
  const inR = q => q && pt.y >= q.y && pt.y <= q.y + q.h;
  if (inR(R.mast) || inR(R.date) || inR(R.foot)) return {kind:'paper'};
  return null;
}
let drag = null;
cv.addEventListener('pointerdown', e => {
  const pt = toBase(e), h = hit(pt);
  if (h && h.kind === 'splash'){ drag = {dx: pt.x - state.splash.x / 100 * W, dy: pt.y - state.splash.y / 100 * H}; cv.setPointerCapture(e.pointerId); return; }
  if (!h){ sel = null; buildPanel(); render(); return; }
  if (h.kind === 'block'){ sel = h.b.id; tab = 'content'; }
  else tab = 'paper';
  buildPanel(); render();
  const card = document.querySelector(`[data-id="${sel}"]`); if (h.kind === 'block' && card) card.scrollIntoView({block:'nearest', behavior:'smooth'});
});

  if (drag){
    state.splash.x = Math.round(Math.max(0, Math.min(100, (pt.x - drag.dx) / W * 100)) * 10) / 10;
    state.splash.y = Math.round(Math.max(0, Math.min(100, (pt.y - drag.dy) / H * 100)) * 10) / 10;
    render(); return;

  const h = hit(pt); cv.style.cursor = h ? (h.kind === 'splash' ? 'move' : 'pointer') : 'default';

cv.addEventListener('dblclick', e => {
  const h = hit(toBase(e)); if (!h || h.kind !== 'block') return;

  else if (h.b.type === 'text'){ const t = document.querySelector(`[data-id="${h.b.id}"] textarea`); if (t){ t.focus(); t.select(); } }

  if (!target){ const s = state.blocks.find(b => b.id === sel); if (s && s.type === 'image' && !s.img) target = s; }

    el('div', {class:'actions'}, (actions || []).map(a => el('button', {class:'btn ' + (a.primary ? 'primary' : ''), type:'button', onclick: () => a.fn(close)}, a.label)),
      el('button', {class:'btn', type:'button', onclick:close}, actions && actions.length ? 'Cancel' : 'Close'))));
  document.body.append(bg);
  return close;
}

/* ---------- export ---------- */
const slug = () => ((state.paper.name || 'lopsedel').toLowerCase().replace(/[åä]/g, 'a').replace(/ö/g, 'o').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'lopsedel') + '-' + new Date().toISOString().slice(0, 10);
async function renderTo(scale){
  if (document.fonts) await document.fonts.ready;
  const c = document.createElement('canvas'); c.width = Math.round(W * scale); c.height = Math.round(H * scale);
  draw(c.getContext('2d'), scale, false); return c;
}
async function save(filename, data, fallback){
  if (dl.ns){
    try { await dl.ns.save({filename, data}); toast('Saved ' + filename); return; }
    catch(e){ if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited'){ toast('A save is already waiting – try again in a moment'); return; } }
  }
  let top = false; try { top = window.self === window.top; } catch(e){}
  if (top){ // running as a local file / normal page: plain browser download
    const blob = data instanceof Blob ? data : new Blob([data], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob); tryAnchor(url, filename);
    setTimeout(() => URL.revokeObjectURL(url), 60000); toast('Downloaded ' + filename); return;
  }
  fallback();
}
function tryAnchor(url, name){ try { const a = el('a', {href:url, download:name}); document.body.append(a); a.click(); a.remove(); } catch(e){} }
async function exportPNG(scale){
  const c = await renderTo(scale);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const name = slug() + '.png';
  save(name, blob, () => {
    const url = URL.createObjectURL(blob); tryAnchor(url, name);
    modal('Your löpsedel', el('div', {}, el('p', {class:'hint', style:'margin:0 0 10px'}, 'Right-click (or long-press) the image and choose “Save image”.'), el('img', {src:url, alt:'Exported poster'})));
  });
}
async function exportPDF(size){
  if (!window.jspdf){ toast('PDF library did not load – export PNG instead'); return; }
  const c = await renderTo(size === 'a1' ? 3.4 : 2.5);
  const doc = new window.jspdf.jsPDF({unit:'mm', format:size, orientation:'portrait'});
  const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
  doc.addImage(c.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pw, ph);
  const blob = doc.output('blob'), name = slug() + '-' + size + '.pdf';
  save(name, blob, () => { tryAnchor(URL.createObjectURL(blob), name); toast('If nothing downloaded, use PNG export instead'); });
}
$('#exportBtn').onclick = () => {
  let fmt = 'png', png = 2, pdf = 'a2';
  const pngRow = segF('Resolution', [['2','2000 × 2828 px'],['3','3000 × 4242 px']], '2', v => png = +v);
  const pdfRow = segF('Paper size', [['a3','A3'],['a2','A2'],['a1','A1']], 'a2', v => pdf = v);
  pdfRow.classList.add('hide');
  const body = el('div', {},
    segF('Format', [['png','PNG image'],['pdf','PDF for print']], 'png', v => { fmt = v; pngRow.classList.toggle('hide', v !== 'png'); pdfRow.classList.toggle('hide', v !== 'pdf'); }),
    pngRow, pdfRow,
    el('div', {class:'hint', style:'margin-top:8px'}, 'Löpsedlar are usually printed on A2 or A3 – the poster already has the right proportions.'));
  modal('Export', body, [{label:'Download', primary:true, fn: async close => { close(); toast('Preparing…'); fmt === 'png' ? await exportPNG(png) : await exportPDF(pdf); }}]);
};
$('#saveBtn').onclick = () => {
  commit();
  const used = {}; state.blocks.forEach(b => { if (b.img && images[b.img]) used[b.img] = images[b.img]; });
  const json = JSON.stringify({app:'lopsedel-studio', v:1, state, images:used});
  save(slug() + '.lopsedel.json', json, () => {
    tryAnchor(URL.createObjectURL(new Blob([json], {type:'application/json'})), slug() + '.lopsedel.json');
    const ta = el('textarea', {rows:6, readonly:true}); ta.value = json;
    modal('Project file', el('div', {}, el('p', {class:'hint', style:'margin:0 0 10px'}, 'If no file was saved, copy this text into a .json file to keep your project.'), ta),
      [{label:'Copy', primary:true, fn: async close => { try { await navigator.clipboard.writeText(json); toast('Copied'); close(); } catch(e){ ta.select(); toast('Press Ctrl+C to copy'); } }}]);
  });
};
$('#openBtn').onclick = () => { $('#jsonInput').value = ''; $('#jsonInput').click(); };
$('#jsonInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    const o = JSON.parse(t); if (!o.state) throw new Error();
    commit(); state = normalize(o.state); Object.assign(images, o.images || {}); imgCache = {}; sel = null;
    state.blocks.forEach(b => b.font && loadFont(b.font)); loadFont(state.paper.font);
    buildPanel(); render(); commit(); toast('Project opened');
  }).catch(() => toast('That file is not a Löpsedel Studio project'));
});
$('#newBtn').onclick = () => { commit(); const d = defaultState(); d.look = state.look; Object.assign(d.paper, {font:state.paper.font, bg:state.paper.bg, color:state.paper.color, dateBg:state.paper.dateBg, dateColor:state.paper.dateColor, name:state.paper.name}); state = d; sel = null; buildPanel(); render(); commit(); toast('New poster – Ctrl+Z to undo'); };
$('#undo').onclick = () => go(-1);
$('#redo').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
  const t = e.target; if (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type === 'text')) return;
  e.preventDefault(); go(e.shiftKey ? 1 : -1);
});
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { tab = t.dataset.tab; buildPanel(); });

/* ---------- init ---------- */
(function init(){
  try { const s = JSON.parse(localStorage.getItem('lopsedel-studio-v1') || 'null'); if (s && s.state){ state = normalize(s.state); images = s.images || {}; } } catch(e){}
  if (!state) state = defaultState();
  FONTS.forEach(f => loadFont(f.name));
  if (document.fonts){ document.fonts.ready.then(render); document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', render); }
  buildPanel(); commit();
  new ResizeObserver(sizeCanvas).observe($('#stage'));
  sizeCanvas();
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(ns => { dl.ns = ns; }).catch(() => {});
  }
})();
</script>
</body>
